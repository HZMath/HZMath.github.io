name: Pull Request Auto Merge

on:
  pull_request_target:
    types:
      - labeled

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'mergeable'

    steps:
      - name: Merge Pull Request
        run: |
          echo "Merging pull request #${{ github.event.pull_request.number }}..."
          gh pr merge ${{ github.event.pull_request.number }} --squash

      - name: Comment on Pull Request
        run: |
          echo "Commenting on pull request #${{ github.event.pull_request.number }}..."
          gh pr comment ${{ github.event.pull_request.number }} --body "This pull request has been automatically merged by GitHub Actions.\nThank you for your contribution!"

      - name: Remove Label
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label mergeable
