name: Pull Request Auto Merge

on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'mergeable'

    steps:
      - name: Merge Pull Request
        id: merge
        continue-on-error: true
        run: |
          echo "Merging pull request #${{ github.event.pull_request.number }}..."
          gh pr merge ${{ github.event.pull_request.number }} --squash

      - name: Comment on Pull Request
        run: |
          echo "Commenting on pull request #${{ github.event.pull_request.number }}..."
          if [ "${{ steps.merge.outcome }}" == "success" ]; then
            echo "Pull request merged successfully."
            gh pr comment ${{ github.event.pull_request.number }} --body "This pull request has been automatically merged by GitHub Actions.\nThank you for your contribution!"
          else
            echo "Failed to merge pull request."
            gh pr comment ${{ github.event.pull_request.number }} --body "Failed to merge this pull request. Please check the mergeability and resolve any conflicts before trying again."
          fi
          

      - name: Remove Label
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label mergeable
